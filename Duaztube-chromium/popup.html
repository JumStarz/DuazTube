<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>DuazTube</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="lt-header">
    <div class="lt-brand">
      <span class="lt-crest">✦</span>
      <span class="lt-title">DuazTube</span>
    </div>
    <div class="lt-controls">
      <button id="btn-enable" class="lt-btn active">Bật</button>
      <button id="btn-autopause" class="lt-btn" data-i18n="btn_autopause">Tự dừng</button>
      <button id="btn-loop" class="lt-btn" data-i18n="btn_loop">Lặp câu</button>
    </div>
  </div>

  <div id="video-controls" class="lt-nav-bar">
    <button id="btn-prev" class="lt-nav-btn" data-i18n="btn_prev">⏮ Trước (A)</button>
    <button id="btn-replay" class="lt-nav-btn" data-i18n="btn_replay">⏯ Phát/Lặp (S)</button>
    <button id="btn-next" class="lt-nav-btn" data-i18n="btn_next">Sau (D) ⏭</button>
  </div>

  <div class="lt-select-bar">
    <div class="lt-translator-row">
      <select id="track-select" style="flex: 1;"></select>
      <button id="btn-ai-asr" class="lt-icon-btn" data-i18n="btn_ai_sub" title="AI Whisper">🎙 AI Sub</button>
      <button id="btn-open-srt" class="lt-icon-btn" data-i18n-title="title_open_srt" title="Nạp file .SRT / .VTT">📂</button>
    </div>
    <div class="lt-translator-row">
      <select id="translator-select">
        <option value="google" data-i18n="tr_google">Dịch: Google (Miễn phí - Vô hạn)</option>
        <option value="microsoft" data-i18n="tr_microsoft">Dịch: Bing / Microsoft (Miễn phí)</option>
        <option value="mymemory" data-i18n="tr_mymemory">Dịch: MyMemory (Miễn phí - Không Key)</option>
        <option value="gemini" data-i18n="tr_gemini">Dịch: AI Gemini (Sát nghĩa - Free Key)</option>
        <option value="groq" data-i18n="tr_groq">Dịch: AI Groq Llama (Siêu nhanh - Free Key)</option>
        <option value="ollama" data-i18n="tr_ollama">Dịch: AI Ollama (Local - Vô hạn)</option>
        <option value="custom" data-i18n="tr_custom">Dịch: AI Custom (OpenAI / OpenRouter)</option>
      </select>
      <button id="btn-appearance" class="lt-icon-btn" data-i18n-title="title_appearance" title="Tùy chỉnh giao diện phụ đề">🎨</button>
      <button id="btn-gear" class="lt-icon-btn" data-i18n-title="title_settings" title="Cài đặt">⚙️</button>
      <button id="btn-download" class="lt-icon-btn" data-i18n-title="title_download" title="Download">⬇</button>
      <button id="btn-retranslate" class="lt-icon-btn" data-i18n-title="title_retranslate" title="Dịch lại">🔄</button>
    </div>
  </div>

  <div id="appearance-panel" class="lt-panel" style="display: none;">
    <div class="lt-panel-title" data-i18n="ap_panel_title">✦ Tùy chỉnh giao diện phụ đề</div>

    <div class="lt-field">
      <label data-i18n="ap_display_mode">Chế độ hiển thị:</label>
      <select id="app-display-mode">
        <option value="both" data-i18n="ap_mode_both">Song ngữ (Gốc + Bản dịch)</option>
        <option value="orig" data-i18n="ap_mode_orig">Chỉ hiển thị ngoại ngữ</option>
        <option value="trans" data-i18n="ap_mode_trans">Chỉ hiển thị bản dịch</option>
      </select>
    </div>

    <div class="lt-range-row">
      <div class="lt-field">
        <label><span data-i18n="ap_orig_size">Cỡ chữ gốc:</span> <span id="val-orig-size">22px</span></label>
        <input type="range" id="app-orig-size" min="14" max="36" step="1" value="22" />
      </div>
      <div class="lt-field">
        <label><span data-i18n="ap_trans_size">Cỡ chữ dịch:</span> <span id="val-trans-size">16px</span></label>
        <input type="range" id="app-trans-size" min="12" max="28" step="1" value="16" />
      </div>
    </div>

    <div class="lt-color-row">
      <div class="lt-field lt-color-field">
        <label data-i18n="ap_orig_color">Màu chữ gốc:</label>
        <input type="color" id="app-orig-color" value="#eef3fb" />
      </div>
      <div class="lt-field lt-color-field">
        <label data-i18n="ap_trans_color">Màu chữ dịch:</label>
        <input type="color" id="app-trans-color" value="#ecd08b" />
      </div>
    </div>

    <div class="lt-range-row">
      <div class="lt-field">
        <label><span data-i18n="ap_bg_opacity">Độ mờ nền:</span> <span id="val-bg-opacity">82%</span></label>
        <input type="range" id="app-bg-opacity" min="0" max="95" step="5" value="82" />
      </div>
      <div class="lt-field">
        <label><span data-i18n="ap_bottom">Vị trí từ đáy:</span> <span id="val-bottom">58px</span></label>
        <input type="range" id="app-bottom" min="10" max="200" step="4" value="58" />
      </div>
    </div>

    <div class="lt-range-row">
      <div class="lt-field">
        <label><span data-i18n="ap_max_width">Độ rộng tối đa:</span> <span id="val-max-width">92%</span></label>
        <input type="range" id="app-max-width" min="40" max="98" step="2" value="92" />
      </div>
      <div class="lt-field">
        <label><span data-i18n="ap_glow_speed">Tốc độ sáng:</span> <span id="val-glow-speed">1.0x</span></label>
        <input type="range" id="app-glow-speed" min="0.5" max="2.0" step="0.1" value="1.0" />
      </div>
    </div>

    <div class="lt-field">
      <label data-i18n="ap_glow">Lyric Glow:</label>
      <select id="app-glow-mode">
        <option value="none" data-i18n="ap_glow_none" selected>Off</option>
        <option value="lyric" data-i18n="ap_glow_spotify">Lyric Glow</option>
        <option value="wave" data-i18n="ap_glow_wave">Lyric Glow + Wave</option>
      </select>
    </div>

    <button id="btn-reset-appearance" class="lt-secondary-btn" data-i18n="ap_reset">Khôi phục mặc định</button>
  </div>

  <div id="download-panel" class="lt-panel" style="display: none;">
    <div class="lt-panel-title" data-i18n="dl_panel_title">⬇ Tải phụ đề xuống máy</div>
    <div class="lt-field">
      <label data-i18n="dl_format_label">Chọn định dạng file:</label>
      <select id="dl-format">
        <option value="srt_dual" data-i18n="dl_fmt_srt_dual">.SRT Song ngữ (Gốc + Dịch)</option>
        <option value="srt_orig" data-i18n="dl_fmt_srt_orig">.SRT Chỉ ngoại ngữ</option>
        <option value="srt_trans" data-i18n="dl_fmt_srt_trans">.SRT Chỉ bản dịch</option>
        <option value="vtt_dual" data-i18n="dl_fmt_vtt_dual">.VTT Song ngữ (Web)</option>
        <option value="txt_dual" data-i18n="dl_fmt_txt_dual">.TXT Văn bản (Không mốc giờ)</option>
      </select>
    </div>
    <button id="btn-do-download" class="lt-save-btn" data-i18n="dl_btn">⬇ Tải xuống ngay</button>
  </div>

  <div id="status-banner" style="display: none;"></div>
  <div id="sub-list"><div class="lt-empty" data-i18n="msg_connecting">Đang kết nối với tab YouTube...</div></div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
